[package]
name = "secure-bank"
version = "0.1.0"
edition = "2021"
description = "Secure banking application skeleton in Rust – educational / foundation only. Not production-ready for real funds."
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "limit", "request-id"] }
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid", "migrate", "rust_decimal"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & Crypto
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

# Money / numbers
rust_decimal = { version = "1", features = ["serde-with-str", "db-postgres"] }
rust_decimal_macros = "1"

# Time & errors
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"

# Config & logging
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
